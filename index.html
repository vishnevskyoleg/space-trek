<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#150f3d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Космик Роблекс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
/* Космик Роблекс v0.5 — «Стиль 01 · 3D · арка» (глина). Холст на весь экран без полос, управление большими пальцами по углам. */
:root {
  --space: #150f3d; --violet: #4a2a8c; --pink: #ff6fae; --mint: #5fe3b5; --lemon: #ffd84d; --sky: #6ec6ff; --cream: #fff7e6; --ink: #2a1659;
  --font-display: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --sl: max(28px, calc(env(safe-area-inset-left, 0px) + 12px));
  --sr: max(28px, calc(env(safe-area-inset-right, 0px) + 12px));
  --sb: max(24px, calc(env(safe-area-inset-bottom, 0px) + 8px));
  --st: max(12px, calc(env(safe-area-inset-top, 0px) + 8px));
  --hl: max(24px, calc(env(safe-area-inset-left, 0px) + 12px));
  --A: clamp(76px, 25vh, 112px); --B: clamp(54px, 17vh, 78px); --RH: clamp(60px, 20vh, 86px); --u: 1;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--space); color: var(--cream); overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: var(--font-display); font-weight: 800; }
[hidden] { display: none !important; }
button { font-family: inherit; }
#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--space); }
#cv { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }

/* ---- глиняная кнопка: экструзия + падающая тень + верхний блик + внутренний объём ---- */
.clay { --h: 8px; --c1: #b48cf0; --c2: #8a5bd6; --c3: #5a3a9e; position: relative; border: 0; border-radius: 50%; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--ink);
  background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 55%);
  box-shadow: 0 var(--h) 0 var(--c3), 0 calc(var(--h) + 4px) 14px rgba(10, 8, 26, .45), inset 0 3px 0 rgba(255, 255, 255, .55), inset 0 -6px 10px rgba(0, 0, 0, .18);
  transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), box-shadow .18s; }
.clay::before { content: ""; position: absolute; left: 10%; top: 8%; width: 55%; height: 40%; border-radius: 50%; background: radial-gradient(ellipse at 30% 22%, rgba(255, 255, 255, .6), transparent 62%); pointer-events: none; }
.clay.small::before { display: none; }
.clay:active, .clay.on { transform: translateY(calc(var(--h) * .7)) scale(.97); box-shadow: 0 calc(var(--h) * .3) 0 var(--c3), 0 6px 8px rgba(10, 8, 26, .4), inset 0 3px 0 rgba(255, 255, 255, .4), inset 0 -2px 4px rgba(0, 0, 0, .18); transition-duration: .08s; }
.clay svg { width: 56%; height: 56%; position: relative; filter: drop-shadow(0 2px 0 rgba(255, 255, 255, .35)); pointer-events: none; }
.clay.light svg { color: var(--cream); filter: drop-shadow(0 3px 0 rgba(42, 22, 89, .55)); }
.pink { --c1: #ff9ac7; --c2: #ff6fae; --c3: #c2417f; }
.mint { --c1: #8af0cb; --c2: #5fe3b5; --c3: #2fa882; }
.lav { --c1: #b48cf0; --c2: #8a5bd6; --c3: #5a3a9e; }
.dim { --c1: #6b5a8f; --c2: #53456f; --c3: #3a2e52; }

/* ---- экраны ---- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.6vh, 20px); text-align: center; z-index: 20; padding: var(--st) var(--sr) var(--sb) var(--sl); box-sizing: border-box; }
#start { background: radial-gradient(120% 90% at 50% 15%, #4a2f94 0%, #26176a 48%, #150f3d 100%); }
#win { background: radial-gradient(ellipse at 50% 42%, rgba(74, 42, 140, .9) 0%, rgba(21, 15, 61, .95) 72%); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#pause { background: rgba(21, 15, 61, .72); z-index: 30; }
#rotate { background: #150f3d; z-index: 50; gap: 22px; }
.logo { margin: 0; font-size: clamp(30px, 11vh, 140px); line-height: 1; font-weight: 900; color: var(--cream); text-wrap: balance; letter-spacing: .01em; text-shadow: 0 3px 0 #c2417f, 0 7px 0 #5a3a9e, 0 14px 16px rgba(10, 8, 26, .5); }
.logo span { display: inline-block; animation: drop .45s cubic-bezier(.34, 1.56, .64, 1) backwards; animation-delay: calc(var(--i) * 40ms); }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
.stage { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 5vw, 44px); }
.prev { display: flex; flex-direction: column; align-items: center; gap: clamp(28px, 7vh, 46px); perspective: 600px; }
.prev .pimg { height: clamp(96px, 38vh, 260px); display: flex; align-items: flex-end; justify-content: center; }
.prev .pimg { gap: 14px; }
.slot { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.slot[hidden] { display: none; }
.slot i { display: none; position: absolute; top: -14px; left: 50%; margin-left: -13px; width: 26px; height: 26px; border-radius: 50%; font-style: normal; font-weight: 900; font-size: 15px; line-height: 26px; color: var(--ink); background: var(--pink); box-shadow: 0 0 0 2px var(--cream), 0 3px 0 #a02a5f; z-index: 2; }
.two .slot i { display: block; }
#slot2 i { background: var(--sky); box-shadow: 0 0 0 2px var(--cream), 0 3px 0 #2a6fa0; }
.two .slot { cursor: pointer; }
.two .slot::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -9px; height: 5px; border-radius: 3px; background: rgba(255, 247, 230, .18); }
.two .slot.cur::after { background: var(--lemon); }
.prev img { height: clamp(96px, 38vh, 260px); width: auto; transform-origin: 50% 100%; animation: breathe 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(10, 8, 26, .45)); }
.prev img.hop { animation: hop .6s cubic-bezier(.3, .7, .4, 1); }
@keyframes breathe { 50% { transform: scale(1.04); } }
@keyframes hop { 0% { transform: translateY(0) rotateY(0); } 40% { transform: translateY(-24px) rotateY(200deg); } 100% { transform: translateY(0) rotateY(360deg); } }
.go { --h: 10px; width: clamp(96px, 24vh, 230px); aspect-ratio: 1; animation: pulse 1.2s ease-in-out infinite; }
.go svg { width: 50%; height: 50%; margin-left: 6%; color: var(--ink); }
@keyframes pulse { 50% { scale: 1.07; } }
#picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; width: calc(4 * var(--cw) + 3 * 16px + 24px); --cw: clamp(64px, 26vh, 150px); --ch: clamp(76px, 29vh, 164px); padding-top: 8px; }
.pick { width: var(--cw); height: var(--ch); border-radius: 22px; border: 0; padding: 8%; box-sizing: border-box; cursor: pointer; display: grid; place-items: center; background: linear-gradient(180deg, var(--t1), var(--t2));
  box-shadow: 0 6px 0 #3a2380, 0 12px 14px rgba(10, 8, 26, .45), inset 0 3px 0 rgba(255, 255, 255, .7), inset 0 -5px 8px rgba(90, 58, 158, .25);
  transition: transform .16s cubic-bezier(.34, 1.56, .64, 1), box-shadow .16s; }
.pick { position: relative; }
.pick img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; pointer-events: none; }
.pick.sel2 { transform: translateY(-4px); outline: 4px solid var(--sky); box-shadow: 0 8px 0 #2a6fa0, 0 14px 14px rgba(10, 8, 26, .45), inset 0 3px 0 rgba(255, 255, 255, .7); }
.pick.sel.sel2 { outline: 4px solid var(--lemon); box-shadow: 0 0 0 9px var(--sky), 0 8px 0 #d9a21f; }
#slot2.cur::after { background: var(--sky) !important; }
.two .prev { padding-top: 16px; }
.two .pick.sel::before, .two .pick.sel2::after { position: absolute; top: -12px; width: 28px; height: 28px; border-radius: 50%; font-weight: 900; font-size: 16px; line-height: 28px; z-index: 3; color: var(--ink); box-shadow: 0 0 0 2px var(--cream), 0 3px 0 rgba(0,0,0,.3); }
.two .pick.sel::before { content: "1"; left: -8px; background: var(--pink); }
.two .pick.sel2::after { content: "2"; right: -8px; background: var(--sky); }
#modeBtn svg { width: 74%; height: 74%; }
#bead2 { position: absolute; top: 50%; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background-color: #6ec6ff; background-size: 128% auto; background-position: 50% 4%; background-repeat: no-repeat; box-shadow: 0 0 0 2px var(--sky), 0 3px 0 #2a6fa0; display: none; }
.two #bead2 { display: block; }
.pick.sel { transform: translateY(-4px); outline: 4px solid var(--lemon); box-shadow: 0 8px 0 #d9a21f, 0 14px 14px rgba(10, 8, 26, .45), inset 0 3px 0 rgba(255, 255, 255, .7); }
.kid { --h: 6px; position: absolute; left: var(--sl); bottom: var(--sb); width: 64px; height: 64px; zoom: var(--u); }
@media (max-height: 440px) { .kid { top: var(--st); bottom: auto; } }
.kid svg { width: 70%; height: 70%; }

.offk { --c1: #8d87a3; --c2: #6f6a85; --c3: #4d4962; }
.offk svg { filter: grayscale(1) opacity(.8); }
.kt:not(.offk)::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 4px solid var(--mint); pointer-events: none; }
.keys { position: absolute; right: var(--sr); bottom: var(--sb); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-size: 17px; color: var(--cream); zoom: var(--u); }
.keys span { background: linear-gradient(180deg, #3a2380, #2a1a6e); box-shadow: 0 3px 0 #1a1050, inset 0 2px 0 rgba(255, 255, 255, .16); padding: 6px 12px; border-radius: 14px; }

#win h1 { margin: 0; font-size: clamp(48px, 18vh, 120px); line-height: 1; font-weight: 900; color: var(--lemon); text-shadow: 0 2px 0 #fff3b0, 0 5px 0 #d9a21f, 0 9px 0 #a8741a, 0 16px 20px rgba(10, 8, 26, .55); animation: pop .6s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } }
.count { display: flex; align-items: center; gap: 12px; font-size: clamp(34px, 12vh, 84px); font-weight: 900; color: var(--cream); font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 #c2417f, 0 10px 14px rgba(10, 8, 26, .5); line-height: 1; }
.count img { height: clamp(40px, 13vh, 72px); width: auto; }
.count.bump { animation: bump .18s ease-out; }
@keyframes bump { 50% { transform: scale(1.18); } }
.rate { display: flex; gap: 10px; height: clamp(34px, 10vh, 56px); }
.rate img { height: 100%; width: auto; opacity: .22; filter: grayscale(1) brightness(.7); transform: scale(.8); transition: all .3s cubic-bezier(.34, 1.56, .64, 1); }
.rate img.on { opacity: 1; filter: none; transform: scale(1); }
.btnrow { display: flex; align-items: center; gap: 24px; visibility: hidden; opacity: 0; transition: opacity .3s; }
.btnrow.ready { visibility: visible; opacity: 1; }
.btnrow .go { width: clamp(104px, 22vh, 200px); }

.round { --h: 6px; width: 64px; height: 64px; }
.round.big { width: 96px; height: 96px; --h: 8px; }
.round svg { width: 56%; height: 56%; }
.hold { position: relative; }
.hold .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); pointer-events: none; transform: rotate(-90deg); }
.hold .ring { opacity: 0; }
.hold.holding .ring { opacity: 1; }
.hold .ring circle { fill: none; stroke: var(--lemon); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
.hold.holding .ring circle { animation: ring 1s linear forwards; }
@keyframes ring { to { stroke-dashoffset: 0; } }
.hold.shake { animation: shake .3s; }
@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
#pmenu .cap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 8px; font-size: 14px; font-weight: 800; color: var(--cream); }
#pmenu { display: flex; gap: 24px; align-items: flex-start; }
#pmenu > .round { margin-top: 6px; }

/* ---- HUD (DOM, не перехватывает касания) ---- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 8; zoom: var(--u); }
.plate { position: absolute; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: rgba(21, 15, 61, .62); border-radius: 23px; box-shadow: inset 0 0 0 2px rgba(255, 247, 230, .35), 0 4px 0 #1a1050; }
#hearts { left: var(--hl); top: var(--st); height: 46px; }
#hearts img { width: 30px; height: 30px; object-fit: contain; transition: transform .25s; }
#hearts img.empty { filter: brightness(0) opacity(.38) drop-shadow(0 0 1px rgba(255, 247, 230, .9)); transform: scale(.82); }
#starPlate { left: var(--hl); top: calc(var(--st) + 54px); height: 44px; padding-left: 8px; }
#starPlate img { height: 32px; width: auto; }
#starNum { font-size: 24px; font-weight: 900; color: var(--cream); font-variant-numeric: tabular-nums; min-width: 1.4ch; text-shadow: 0 2px 0 var(--ink); }
#starNum.bump { animation: bump .22s ease-out; }
#track { position: absolute; left: 50%; top: calc(var(--st) + 14px); width: 240px; height: 14px; margin-left: -120px; border-radius: 8px; background: #1a1050; box-shadow: inset 0 3px 4px rgba(0, 0, 0, .5), 0 0 0 3px rgba(255, 247, 230, .35), 0 2px 0 3px rgba(255, 255, 255, .1); }
#fill { height: 100%; border-radius: 8px; background: linear-gradient(180deg, #8af0cb, #5fe3b5); width: 6%; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .5); }
#bead { position: absolute; top: 50%; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background-color: #ffd84d; background-size: 128% auto; background-position: 50% 4%; background-repeat: no-repeat; box-shadow: 0 0 0 2px var(--lemon), 0 3px 0 #d9a21f; }
#goal { position: absolute; right: -22px; top: 50%; height: 36px; width: auto; transform: translateY(-62%); }
#pauseBtn { zoom: var(--u); position: absolute; right: max(16px, calc(env(safe-area-inset-right, 0px) + 8px)); top: var(--st); width: 52px; height: 52px; z-index: 12; opacity: .75; --h: 5px; }
#pauseBtn svg:not(.ring) { width: 46%; height: 46%; }

/* ---- экранное управление ---- */
#touch { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#rail { position: absolute; left: var(--sl); bottom: var(--sb); display: flex; gap: 8px; pointer-events: auto; touch-action: none; }
#rail::before, .act::after { content: ""; position: absolute; inset: -20px; }
#rail .clay { width: var(--RH); height: var(--RH); --h: 8px; pointer-events: none; }
#rail .clay svg { width: 46%; height: 46%; }
.act { position: absolute; pointer-events: auto; touch-action: none; }
.act::after { inset: -8px; border-radius: 50%; }
#btnA { right: var(--sr); bottom: var(--sb); width: var(--A); height: var(--A); --h: 9px; }
#btnB { width: var(--B); height: var(--B); --h: 7px; right: calc(var(--sr) + var(--A) / 2 + 22.5vh - var(--B) / 2); bottom: calc(var(--sb) + var(--A) / 2 + 13vh - var(--B) / 2); }
#touch .clay { opacity: .8; }
#btnB::after { inset: -4px; }
.act svg { width: 52%; height: 52%; }
.hint { animation: hint .8s ease-in-out infinite; }
@keyframes hint { 50% { scale: 1.06; filter: brightness(1.15); } }
#wrap:not([data-state="play"]) #touch, #wrap:not([data-state="play"]) #hud, #wrap:not([data-state="play"]) #pauseBtn { display: none; }
#wrap.kidmode #btnB, #wrap.kidmode #hearts { display: none; }
#wrap.kidmode #starPlate { top: var(--st); }

#rot { position: relative; width: clamp(110px, 40vmin, 170px); aspect-ratio: 1.8; margin-bottom: clamp(40px, 14vmin, 80px); }
#rot .ph { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(180deg, #b48cf0, #8a5bd6); box-shadow: 0 8px 0 #5a3a9e, 0 16px 20px rgba(10, 8, 26, .45), inset 0 3px 0 rgba(255, 255, 255, .5); display: grid; place-items: center; animation: rotp 2.6s ease-in-out infinite; }
#rot .ph div { width: 86%; height: 78%; border-radius: 14px; background: #26176a; box-shadow: inset 0 4px 8px rgba(0, 0, 0, .4); display: grid; place-items: center; }
#rot .ph div { position: relative; }
#rot .ph img { position: absolute; left: 50%; top: 8%; height: 84%; width: auto; transform: translateX(-50%); }
@keyframes rotp { 0%, 20% { transform: rotate(90deg); } 65%, 100% { transform: rotate(0); } }
#rotate p { margin: 0; font-size: 22px; font-weight: 800; color: #d9d2ff; }
#rotate small { display: block; margin-top: 6px; font-size: 14px; font-weight: 600; opacity: .6; }
@media (prefers-reduced-motion: reduce) { #rot .ph, .prev img, .go, .hint, .logo span { animation: none !important; } }
@media (max-height: 340px) { .logo { font-size: 28px; } .prev .pimg { height: 70px; } .prev img { height: 70px; } }
#lvlBtn b { font-size: 34px; font-weight: 900; color: var(--cream); text-shadow: 0 2px 0 var(--ink); line-height: 1; position: relative; }
.nb { position: absolute; right: -4px; top: -4px; width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--lemon); color: var(--ink); font-style: normal; font-weight: 900; font-size: clamp(18px, 5vh, 34px); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--cream), 0 3px 0 #a8741a; }
#winBtns.hasnext #againBtn { width: clamp(72px, 16vh, 150px); }

/* ---- комната космонавта: стартовый экран ---- */
.red { --c1: #ff8a8a; --c2: #ff3d55; --c3: #a8132b; }
#start { background: #4b2a86; overflow: hidden; }
#roomBg { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(16px) brightness(.9); }
#room { --rw: min(100vw, 177.7778vh); position: absolute; left: 50%; top: 50%; width: var(--rw); height: calc(var(--rw) * 9 / 16); transform: translate(-50%, -50%); background-size: 100% 100%; background-repeat: no-repeat; }
#room .logo { position: absolute; left: 37.9%; top: 23%; width: 24%; transform: translate(-50%, -50%); font-size: calc(var(--rw) * 0.047); line-height: .98; z-index: 3; pointer-events: none; }
#room .prev { position: absolute; left: 31.8%; top: 68%; transform: translate(-50%, -100%); z-index: 4; display: block; perspective: 600px; }
#room .prev .pimg, #room .prev .slot { height: calc(var(--rw) * 0.2); }
#room .prev img { height: calc(var(--rw) * 0.2); }
#room #picks { position: absolute; left: 56.8%; top: 19.8%; width: 40.3%; height: 36.2%; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: calc(var(--rw) * 0.0135) calc(var(--rw) * 0.0138); z-index: 4; }
#room .pick { width: 100%; height: 100%; border-radius: calc(var(--rw) * 0.016); padding: 5%; }
#room #playBtn { --s: calc(var(--rw) * 0.132); position: absolute; left: calc(38.1% - var(--s) / 2); top: calc(77.5% - var(--s) / 2); width: var(--s); z-index: 4; color: var(--cream) !important; }
#start .keys { zoom: calc(var(--u) * .8); bottom: 8px; opacity: .55; }
#room .pick.lock { display: grid; place-items: center; background: rgba(20,14,50,.45); border: 3px dashed rgba(255,247,230,.35); box-shadow: none; pointer-events: none; color: rgba(255,247,230,.55); font-weight: 900; font-size: calc(var(--rw) * 0.03); }
#room .planet { --s: calc(var(--rw) * 0.092); position: absolute; top: calc(83% - var(--s) / 2); width: var(--s); height: var(--s); border: 0; padding: 0; background: none; cursor: pointer; z-index: 4; opacity: .86; filter: saturate(.85); transition: transform .2s, opacity .2s; }
#room #lvl1 { left: calc(53.2% - var(--s) / 2); }
#room #lvl2 { left: calc(64.4% - var(--s) / 2); }
#room .planet img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 5px 4px rgba(10, 8, 26, .5)); pointer-events: none; }
#room .planet b { position: absolute; right: -6%; top: -6%; width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--cream); color: var(--ink); font-weight: 900; font-size: calc(var(--rw) * 0.02); line-height: 1; display: grid; place-items: center; box-shadow: 0 2px 0 rgba(10, 8, 26, .35); }
#room .planet.sel { opacity: 1; filter: none; transform: translateY(-9%) scale(1.08); animation: bob 1.8s ease-in-out infinite; }
#room .planet.sel::after { content: ""; position: absolute; inset: -8%; border-radius: 50%; box-shadow: 0 0 0 3px #ffd84d, 0 0 18px 6px rgba(255, 216, 77, .55); pointer-events: none; }
@keyframes bob { 50% { translate: 0 -4%; } }
@media (prefers-reduced-motion: reduce) { #room .planet.sel { animation: none; } }
</style>
</head><body>

<div id="wrap" data-state="title">
  <canvas id="cv" aria-label="Игра: Космик Роблекс"></canvas>

  <div id="hud">
    <div id="hearts" class="plate"></div>
    <div id="starPlate" class="plate"><img id="starIcon" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span id="starNum">0</span></div>
    <div id="track"><div id="fill"></div><div id="bead"></div><div id="bead2"></div><img id="goal" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
